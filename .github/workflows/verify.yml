name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: native tests + differential verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Unit tests
        run: cargo test -p fuzzy --verbose

      - name: Build wasm
        run: cargo build -p wasm --release --target wasm32-unknown-unknown

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The load-bearing claim: Rust scoring, ranking, and ordering are exactly
      # what the JS reference produces. 550k comparisons run here per push.
      - name: Differential verification (Rust vs JS reference)
        run: node scripts/verify.mjs

      - name: Upload wasm artifact
        uses: actions/upload-artifact@v4
        with:
          name: fuzzy-search-wasm
          path: target/wasm32-unknown-unknown/release/wasm.wasm
          if-no-files-found: error

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
